<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Энергоузел — GeoJSON</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font:14px Arial,sans-serif;overflow:hidden;background:#eef0f2}
#map{position:absolute;inset:0}.bar{position:absolute;z-index:1000;top:14px;left:14px;display:flex;gap:8px;align-items:center;background:#fff;padding:8px;border-radius:8px;box-shadow:0 2px 8px #0003}.brand{font-weight:600;padding:0 8px;color:#202124}.search{width:290px;height:38px;border:1px solid #dadce0;border-radius:20px;padding:0 15px;outline:0}.btn{height:38px;border:1px solid #dadce0;background:#fff;border-radius:6px;padding:0 12px;cursor:pointer}.btn:hover,.btn.active{background:#e8f0fe;color:#1967d2}
.legend{position:absolute;z-index:1000;left:14px;bottom:20px;background:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:12px}.legend b{display:block;margin-bottom:8px}.lr{display:flex;gap:8px;align-items:center;margin:6px 0}.ls{width:28px;border-top:4px solid}.c110{border-color:#d93025}.c35{border-color:#f29900}.c10{border-color:#1a73e8}.c04{border-color:#34a853}.tp{width:8px;height:8px;border-radius:50%;background:#7e57c2;border:1px solid #fff;box-shadow:0 1px 4px #0008}
.panel{display:none;position:absolute;z-index:1001;right:14px;top:14px;width:360px;max-height:calc(100vh - 28px);background:#fff;border-radius:10px;box-shadow:0 3px 14px #0004;overflow:hidden}.panel.open{display:block}.ph{display:flex;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #eee}.pt{font-size:17px;font-weight:600;color:#202124}.ps{font-size:12px;color:#5f6368;margin-top:4px}.close{border:0;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:18px}.pb{padding:14px 17px;overflow:auto;max-height:calc(100vh - 100px)}.st{font-size:11px;font-weight:bold;color:#5f6368;text-transform:uppercase;letter-spacing:.08em;margin:5px 0 8px}.row{display:grid;grid-template-columns:42% 58%;gap:8px;padding:8px 0;border-bottom:1px solid #f0f1f2;font-size:12px}.key{color:#5f6368}.val{color:#202124;font-weight:500;word-break:break-word}.chip{display:inline-block;background:#f1f3f4;border-radius:14px;padding:5px 8px;margin:3px 2px;font-size:11px;cursor:pointer}.chip:hover{background:#e8f0fe;color:#1967d2}.status{position:absolute;z-index:1000;right:14px;bottom:20px;background:#fff;padding:7px 11px;border-radius:6px;box-shadow:0 1px 5px #0003;font-size:11px;color:#5f6368}
.tp-marker{width:8px!important;height:8px!important;margin:-4px 0 0 -4px!important;border-radius:50%;background:#7e57c2;border:1px solid #fff;box-shadow:0 1px 4px #0008}.tp-marker.sel{transform:scale(1.8);box-shadow:0 0 0 4px #4285f433,0 0 10px #4285f4}.generic{width:7px!important;height:7px!important;margin:-3.5px 0 0 -3.5px!important;border-radius:50%;background:#5f6368;border:1px solid #fff}
@media(max-width:760px){.bar{left:8px;right:8px;flex-wrap:wrap}.brand{display:none}.search{flex:1;width:auto}.panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:55vh}.legend{left:8px;bottom:8px}.status{display:none}}
</style></head>
<body>
<div id="map"></div>
<div class="bar"><div class="brand">⚡ Энергоузел</div><input id="q" class="search" placeholder="Поиск ТП, ВЛ, фидера..."><button id="reset" class="btn">Сброс</button><button id="sat" class="btn">Спутник</button></div>
<div class="legend"><b>Электрическая сеть</b><div class="lr"><i class="ls c110"></i>110 кВ</div><div class="lr"><i class="ls c35"></i>35 кВ</div><div class="lr"><i class="ls c10"></i>10 кВ</div><div class="lr"><i class="ls c04"></i>0,4 кВ</div><div class="lr"><i class="tp"></i>ТП</div></div>
<div id="status" class="status">Загрузка...</div>
<div id="panel" class="panel"><div class="ph"><div><div id="title" class="pt">Объект</div><div id="sub" class="ps"></div></div><button id="close" class="close">×</button></div><div id="body" class="pb"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FILE='map.geojson';
const map=L.map('map',{preferCanvas:true}).setView([44,67],9);
const base=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
const colors={'110':'#d93025','35':'#f29900','10':'#1a73e8','0.4':'#34a853','04':'#34a853'};
let data=[],layers=new Map(),selected=null,satellite=false;
const props=f=>f.properties||{};const name=f=>props(f)._source_name||props(f).name||'Без названия';
const text=f=>name(f)+' '+Object.entries(props(f)).filter(([k])=>!k.startsWith('_relations')).map(x=>x[1]).join(' ');
function voltage(f){let s=text(f).toLowerCase().replaceAll(',','.');if(/110\s*кв|вл[- ]110/.test(s))return'110';if(/35\s*кв|вл[- ]35/.test(s))return'35';if(/0\.4\s*кв|вл[- ]0\.4/.test(s))return'0.4';if(/10\s*кв|вл[- ]10|кл[- ]10/.test(s))return'10';return null}
function isTP(f){let s=text(f).toLowerCase(),c=String(props(f)._object_category||'').toLowerCase();return f.geometry.type==='Point'&&(c==='transformer_point'||/\bтп\b/.test(s)||s.includes('ктп')||s.includes('трансформатор'))}
function style(f){let v=voltage(f);return{color:colors[v]||'#5f6368',weight:v==='110'?6:v==='35'?5:v==='10'?3.5:v==='0.4'?2:2,opacity:.88,lineCap:'round',lineJoin:'round'}}
function make(f){if(f.geometry.type==='Point'){let tp=isTP(f),ic=L.divIcon({className:tp?'tp-marker':'generic',html:'',iconSize:tp?[8,8]:[7,7],iconAnchor:tp?[4,4]:[3.5,3.5]});return L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{icon:ic,riseOnHover:true})}if(f.geometry.type==='LineString')return L.geoJSON(f,{style:style(f)});return L.geoJSON(f,{style:{color:'#5f6368',weight:1.5,fillColor:'#9aa0a6',fillOpacity:.13}})}
function select(f,l,fly=true){if(selected){let old=selected.f;if(old.geometry.type==='LineString')selected.l.setStyle(style(old));if(selected.l._icon)selected.l._icon.classList.remove('sel')}selected={f,l};if(l._icon)l._icon.classList.add('sel');if(f.geometry.type==='LineString'){let s=style(f);l.setStyle({...s,weight:s.weight+2,opacity:1});if(fly)map.fitBounds(l.getBounds(),{padding:[80,80],maxZoom:16})}else if(f.geometry.type==='Polygon'){if(fly)map.fitBounds(l.getBounds(),{padding:[80,80],maxZoom:16})}else if(fly)map.flyTo(l.getLatLng(),Math.max(map.getZoom(),16),{duration:.6});show(f)}
function clear(){if(selected){let f=selected.f;if(f.geometry.type==='LineString')selected.l.setStyle(style(f));if(selected.l._icon)selected.l._icon.classList.remove('sel')}selected=null;document.getElementById('panel').classList.remove('open')}
function show(f){let p=props(f),panel=document.getElementById('panel'),body=document.getElementById('body');panel.classList.add('open');document.getElementById('title').textContent=name(f);document.getElementById('sub').textContent=(p._object_category||'объект')+(voltage(f)?' • '+voltage(f).replace('0.4','0,4')+' кВ':'');body.innerHTML='<div class="st">Характеристики</div>';
Object.entries(p).forEach(([k,v])=>{if(k.startsWith('_')||v===''||v==null)return;let r=document.createElement('div');r.className='row';r.innerHTML='<div class="key">'+esc(k)+'</div><div class="val">'+esc(typeof v==='object'?JSON.stringify(v):String(v))+'</div>';body.appendChild(r)});
let rel=p._relations;if(rel){let wrap=document.createElement('div');wrap.style.marginTop='14px';wrap.innerHTML='<div class="st">Связи</div>';[['Питается от',rel.supplied_by],['Питает',rel.supplies],['Пространственные кандидаты',rel.spatial_candidates]].forEach(([lab,arr])=>{if(!arr||!arr.length)return;let d=document.createElement('div');d.style.cssText='font-size:11px;color:#5f6368;margin:7px 0 3px';d.textContent=lab;wrap.appendChild(d);arr.slice(0,20).forEach(x=>{let id=typeof x==='string'?x:x.feature_id, c=document.createElement('span');c.className='chip';c.textContent=typeof x==='string'?id:id+' • '+x.distance_m+' м';c.onclick=()=>{let t=layers.get(id),tf=data.find(z=>props(z)._feature_id===id);if(t&&tf){select(tf,t,true)}};wrap.appendChild(c)})});body.appendChild(wrap)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
fetch(FILE+'?v='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(g=>{data=g.features||[];let group=L.layerGroup();data.forEach(f=>{let id=props(f)._feature_id||'f'+layers.size,l=make(f);layers.set(id,l);l.on('click',e=>{if(e.originalEvent)L.DomEvent.stopPropagation(e.originalEvent);select(f,l)});l.on('mouseover',()=>{if(f.geometry.type==='LineString'){let s=style(f);l.setStyle({...s,weight:s.weight+2,opacity:1})}});l.on('mouseout',()=>{if(selected?.l!==l&&f.geometry.type==='LineString')l.setStyle(style(f))});l.addTo(group)});group.addTo(map);if(group.getBounds().isValid())map.fitBounds(group.getBounds(),{padding:[30,30]});document.getElementById('status').textContent=`Объектов: ${data.length} • ТП: ${data.filter(isTP).length}`}).catch(()=>{document.getElementById('status').textContent='Ошибка map.geojson';alert('Не удалось загрузить map.geojson. Он должен лежать рядом с index.html.')});
map.on('click',clear);document.getElementById('close').onclick=clear;
document.getElementById('reset').onclick=()=>{document.getElementById('q').value='';clear();let ls=[...layers.values()];if(ls.length)map.fitBounds(L.featureGroup(ls).getBounds(),{padding:[30,30]})};
document.getElementById('sat').onclick=()=>{satellite=!satellite;if(satellite){map.removeLayer(base);sat.addTo(map);document.getElementById('sat').textContent='Карта';document.getElementById('sat').classList.add('active')}else{map.removeLayer(sat);base.addTo(map);document.getElementById('sat').textContent='Спутник';document.getElementById('sat').classList.remove('active')}};
document.getElementById('q').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){data.forEach(f=>{let l=layers.get(props(f)._feature_id);if(l?._icon)l._icon.style.display='';if(l?.setStyle&&f.geometry.type==='LineString')l.setStyle(style(f))});return}let first=null;data.forEach(f=>{let ok=text(f).toLowerCase().includes(q),l=layers.get(props(f)._feature_id);if(l?._icon)l._icon.style.display=ok?'':'none';if(l?.setStyle&&f.geometry.type==='LineString'){let s=style(f);l.setStyle(ok?{...s,weight:s.weight+2,opacity:1}:{...s,opacity:.12})}if(ok&&!first)first={f,l}});if(first)select(first.f,first.l,true)};
</script></body></html>
