<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта ВЛ-0,4 кВ и ТП</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    #map { width: 100%; height: 100%; }

    /* ===== Правая панель-карточка ===== */
    #side-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 340px;
      max-height: calc(100% - 24px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn .35s ease;
    }
    #side-panel.visible { display: flex; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .panel-header {
      background: linear-gradient(135deg, #01579B, #0288D1);
      color: #fff;
      padding: 16px 18px 14px;
      position: relative;
    }
    .panel-header .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 28px;
      text-align: center;
    }
    .panel-header .close-btn:hover { background: rgba(255,255,255,.35); }
    .panel-header h2 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      padding-right: 32px;
      word-break: break-word;
    }
    .panel-header .badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,.22);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .panel-body {
      padding: 14px 18px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .field {
      margin-bottom: 10px;
      font-size: 13.5px;
      line-height: 1.4;
      color: #333;
    }
    .field .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #888;
      margin-bottom: 2px;
    }
    .field .value { color: #1a1a1a; }

    .links-block { margin-top: 14px; }
    .links-block .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #888;
      margin-bottom: 8px;
    }
    .link-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #f5f8ff;
      border: 1px solid #d0e0f7;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      text-decoration: none;
      color: #1565c0;
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .link-btn:hover {
      background: #e3f0ff;
      border-color: #90caf9;
    }
    .link-btn .link-title {
      display: block;
      color: #0d47a1;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .link-btn .link-url {
      display: block;
      font-size: 11px;
      color: #64b5f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lines-info {
      margin-top: 12px;
      padding: 10px 12px;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 13px;
      color: #2e7d32;
      font-weight: 600;
    }
    .lines-info.empty {
      background: #fff3e0;
      color: #e65100;
    }

    /* ===== Подсказка ===== */
    #hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      font-size: 13.5px;
      color: #333;
      pointer-events: none;
      transition: opacity .3s;
      white-space: nowrap;
    }
    #hint strong { color: #01579B; }

    /* ===== Легенда ===== */
    #legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 900;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      font-size: 12.5px;
      color: #333;
      line-height: 1.7;
    }
    #legend .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.15);
    }
    #legend .dot.has { background: #0F9D58; }
    #legend .dot.no  { background: #90A4AE; }

    /* ===== Анимация линий (медленное появление + бегущий пунктир) ===== */
    .line-path {
      stroke-dasharray: 14 10;
      animation: dashMove 2.8s linear infinite, fadeInLine 2s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeInLine {
      0%   { opacity: 0; stroke-width: 1.5; }
      50%  { opacity: 0.6; }
      100% { opacity: 1; stroke-width: 4; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -48; }
    }

    /* Подписи фидеров */
    .feeder-label {
      background: #fff;
      border: 1.5px solid #0F9D58;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      color: #1b5e20;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      white-space: nowrap;
      opacity: 0;
      animation: labelAppear 0.6s ease 1.9s forwards;
    }
    @keyframes labelAppear {
      to { opacity: 1; }
    }

    /* Tooltip Leaflet */
    .leaflet-tooltip.point-tip {
      background: #263238;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(0,0,0,.25);
    }
    .leaflet-tooltip.point-tip::before { border-top-color: #263238; }
  </style>
</head>
<body>
  <div id="hint">Нажмите на <strong>зелёную точку</strong>, чтобы показать линии</div>
  <div id="legend">
    <div><span class="dot has"></span>ТП с линиями ВЛ-0,4 кВ</div>
    <div><span class="dot no"></span>ТП без линий</div>
  </div>
  <div id="map"></div>

  <div id="side-panel">
    <div class="panel-header">
      <button class="close-btn" id="close-panel" title="Закрыть">✕</button>
      <h2 id="panel-title">—</h2>
      <div class="badge" id="panel-badge">Трансформаторный пункт</div>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==================== Карта ====================
    const map = L.map('map', { zoomControl: true }).setView([44.18, 66.70], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ==================== Состояние ====================
    let allLines = [];
    let activePointId = null;
    let activeLineLayers = [];
    let feederLabels = [];

    // ==================== Утилиты ====================
    function getProp(props, ...keys) {
      for (const k of keys) {
        if (props[k] != null && String(props[k]).trim() !== '') return String(props[k]);
      }
      return '';
    }

    function normalize(s) {
      return String(s || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
    }

    /** Главный номер ТП из названия (не путает с «10/0,4») */
    function extractMainNumber(name) {
      const n = normalize(name);
      if (!n) return null;
      // 1. Явный №XXX
      let m = n.match(/№\s*(\d{2,4})\b/);
      if (m) return m[1];
      // 2. Число в начале: «610 КТПН…», «489 КТПБ…»
      m = n.match(/^(\d{2,4})\b/);
      if (m) return m[1];
      // 3. Число в конце: «КТП-10/0,4 кВ 112»
      m = n.match(/(?:кв|ктп[а-я()nнб]*|тп)\s+(\d{2,4})\s*$/i);
      if (m) return m[1];
      return null;
    }

    /** Номер ТП, от которого идёт линия */
    function getLineTpNumber(props) {
      const name = normalize(getProp(props, 'Name', 'name'));
      const desc = normalize(getProp(props, 'Description', 'description'));

      // 1. «Запитано от: …»
      let m = desc.match(/Запитано\s+от\s*:\s*([^<]+)/i);
      if (m) {
        const num = extractMainNumber(m[1]);
        if (num) return num;
      }
      // 2. «от …» в названии
      m = name.match(/от\s+(.+)$/i);
      if (m) {
        const num = extractMainNumber(m[1]);
        if (num) return num;
      }
      // 3. № в названии
      m = name.match(/№\s*(\d{2,4})\b/);
      if (m) return m[1];
      return null;
    }

    /** Номер фидера из описания */
    function getFeeder(props) {
      const desc = getProp(props, 'Description', 'description');
      let m = desc.match(/Фидер\s*№?\s*([0-9иИ,\s\-–]+)/i);
      if (m) return 'Фидер №' + m[1].trim();
      return null;
    }

    /** Извлечь ссылки с названиями из описания */
    function extractLinks(text) {
      if (!text) return [];
      const links = [];
      const urlRe = /https?:\/\/[^\s<>"']+/gi;
      const parts = text.split(/(?=https?:\/\/)/i);

      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        const urlMatch = part.match(urlRe);
        if (!urlMatch) continue;
        const url = urlMatch[0].replace(/[.,;)\]]+$/, '');
        let title = part.replace(urlRe, '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ' ').trim();
        title = title.replace(/[:：\s]+$/, '').trim();
        if (!title && i > 0) {
          title = parts[i - 1].replace(urlRe, '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ' ').trim();
          title = title.replace(/[:：\s]+$/, '').trim();
        }
        if (!title || title.length < 2) {
          if (/maps\.google|google\.com\/maps/i.test(url)) title = 'Гео-схема';
          else if (/docs\.google|drawings/i.test(url)) title = 'Поопорная схема';
          else if (/drive\.google/i.test(url)) title = 'Документ Google Drive';
          else title = 'Открыть ссылку';
        } else {
          if (title.length > 60) title = title.slice(0, 57) + '…';
        }
        links.push({ title, url });
      }
      return links;
    }

    // ==================== Панель ====================
    const panel = document.getElementById('side-panel');
    const panelTitle = document.getElementById('panel-title');
    const panelBadge = document.getElementById('panel-badge');
    const panelBody = document.getElementById('panel-body');

    document.getElementById('close-panel').onclick = () => {
      hidePanel();
      clearActive();
    };

    function hidePanel() {
      panel.classList.remove('visible');
    }

    function showPointPanel(props, linesCount) {
      const name = getProp(props, 'Name', 'name') || 'ТП';
      panelTitle.textContent = name;
      panelBadge.textContent = 'Трансформаторный пункт';

      const fields = [
        ['Ном. мощность', getProp(props, 'Ном.мощность, кВА')],
        ['Год ввода', getProp(props, 'Год ввода')],
        ['Запитано от фидера', getProp(props, 'Запитано от фидера')],
        ['На балансе', getProp(props, 'На балансе')],
        ['Зав / Инв №', getProp(props, 'Зав/Инв №')],
      ];

      let html = '';
      fields.forEach(([label, val]) => {
        if (val) {
          html += `<div class="field"><div class="label">${label}</div><div class="value">${val}</div></div>`;
        }
      });

      // Описание без картинок и ссылок
      let desc = getProp(props, 'описание', 'Description', 'description');
      desc = desc.replace(/<img[^>]*>/gi, '').replace(/https?:\/\/[^\s<]+/g, '').replace(/<br\s*\/?>/gi, '<br>').trim();
      desc = desc.replace(/Ном\.мощность[\s\S]*?(?=<br>|$)/gi, '')
                 .replace(/Год ввода[\s\S]*?(?=<br>|$)/gi, '')
                 .replace(/Запитано от фидера[\s\S]*?(?=<br>|$)/gi, '')
                 .replace(/На балансе[\s\S]*?(?=<br>|$)/gi, '')
                 .replace(/Зав\/Инв №[\s\S]*?(?=<br>|$)/gi, '')
                 .replace(/(<br>\s*)+/g, '<br>').replace(/^<br>|<br>$/g, '').trim();
      if (desc && desc.length > 3) {
        html += `<div class="field"><div class="label">Описание</div><div class="value">${desc}</div></div>`;
      }

      // Ссылки
      const rawDesc = getProp(props, 'описание', 'Description', 'description');
      const links = extractLinks(rawDesc);
      if (links.length) {
        html += `<div class="links-block"><div class="label">Ссылки</div>`;
        links.forEach(l => {
          html += `<a class="link-btn" href="${l.url}" target="_blank" rel="noopener">
            <span class="link-title">${l.title}</span>
            <span class="link-url">${l.url}</span>
          </a>`;
        });
        html += `</div>`;
      }

      if (linesCount > 0) {
        html += `<div class="lines-info">Показано линий: ${linesCount}</div>`;
      } else {
        html += `<div class="lines-info empty">Связанных линий ВЛ-0,4 кВ нет</div>`;
      }

      panelBody.innerHTML = html;
      panel.classList.add('visible');
    }

    // ==================== Линии ====================
    function clearActive() {
      activeLineLayers.forEach(l => map.removeLayer(l));
      activeLineLayers = [];
      feederLabels.forEach(l => map.removeLayer(l));
      feederLabels = [];
      activePointId = null;
      document.getElementById('hint').style.opacity = '1';
    }

    function midPoint(coords) {
      if (!coords || coords.length < 2) return null;
      const mid = Math.floor(coords.length / 2);
      return [coords[mid][1], coords[mid][0]];
    }

    function showLinesForPoint(feature, layer) {
      const pointId = feature.properties._id;
      const props = feature.properties;
      const num = extractMainNumber(getProp(props, 'Name', 'name'));

      if (activePointId === pointId) {
        clearActive();
        hidePanel();
        return;
      }

      clearActive();
      activePointId = pointId;

      // Строгое сопоставление только по номеру
      const related = allLines.filter(lf => {
        const lineNum = getLineTpNumber(lf.properties);
        return lineNum && num && lineNum === num;
      });

      showPointPanel(props, related.length);

      if (related.length === 0) {
        document.getElementById('hint').style.opacity = '0.35';
        return;
      }

      related.forEach((lf, idx) => {
        const feeder = getFeeder(lf.properties);
        const lineName = getProp(lf.properties, 'Name', 'name');

        const geoLayer = L.geoJSON(lf, {
          style: {
            color: '#0F9D58',
            weight: 4,
            opacity: 1,
            lineCap: 'round',
            lineJoin: 'round',
            className: 'line-path'
          },
          onEachFeature: (f, l) => {
            let popupHtml = `<b>${lineName}</b>`;
            if (feeder) popupHtml += `<br>${feeder}`;
            l.bindPopup(popupHtml);
          }
        }).addTo(map);

        activeLineLayers.push(geoLayer);

        // Подпись фидера после завершения анимации
        setTimeout(() => {
          try {
            const coords = lf.geometry.coordinates;
            let lineCoords = coords;
            if (lf.geometry.type === 'MultiLineString') lineCoords = coords[0];
            const mid = midPoint(lineCoords);
            if (mid && feeder) {
              const label = L.marker(mid, {
                icon: L.divIcon({
                  className: '',
                  html: `<div class="feeder-label">${feeder}</div>`,
                  iconSize: null,
                  iconAnchor: [0, 0]
                }),
                interactive: false
              }).addTo(map);
              feederLabels.push(label);
            }
          } catch (e) {}
        }, 1900 + idx * 120);
      });

      const group = L.featureGroup([layer, ...activeLineLayers]);
      try {
        map.fitBounds(group.getBounds().pad(0.3), { maxZoom: 16, animate: true, duration: 0.9 });
      } catch (e) {}

      document.getElementById('hint').style.opacity = '0.35';
    }

    // ==================== Загрузка ====================
    Promise.all([
      fetch('data/points.geojson').then(r => r.json()),
      fetch('data/lines.geojson').then(r => r.json())
    ]).then(([pointsData, linesData]) => {

      allLines = linesData.features.map((f, i) => {
        f.properties._id = 'line-' + i;
        return f;
      });

      // Номера ТП, у которых реально есть линии
      const numsWithLines = new Set();
      allLines.forEach(lf => {
        const n = getLineTpNumber(lf.properties);
        if (n) numsWithLines.add(n);
      });

      pointsData.features.forEach((f, i) => {
        f.properties._id = 'point-' + i;
      });

      L.geoJSON(pointsData, {
        pointToLayer: (feature, latlng) => {
          const name = getProp(feature.properties, 'Name', 'name');
          const num = extractMainNumber(name);
          const hasLines = num && numsWithLines.has(num);

          const marker = L.circleMarker(latlng, {
            radius: hasLines ? 8 : 5,
            fillColor: hasLines ? '#0F9D58' : '#90A4AE',
            color: '#fff',
            weight: hasLines ? 2.5 : 1.5,
            opacity: 1,
            fillOpacity: hasLines ? 0.95 : 0.7
          });

          // При наведении — только название
          marker.bindTooltip(name, {
            direction: 'top',
            offset: [0, -8],
            className: 'point-tip',
            opacity: 0.95
          });

          return marker;
        },
        onEachFeature: (feature, layer) => {
          const name = getProp(feature.properties, 'Name', 'name');
          const num = extractMainNumber(name);
          const hasLines = num && numsWithLines.has(num);

          layer.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            showLinesForPoint(feature, layer);
          });

          layer.on('mouseover', () => {
            layer.setStyle({
              radius: hasLines ? 11 : 7,
              fillColor: hasLines ? '#00C853' : '#78909C'
            });
          });
          layer.on('mouseout', () => {
            layer.setStyle({
              radius: hasLines ? 8 : 5,
              fillColor: hasLines ? '#0F9D58' : '#90A4AE'
            });
          });
        }
      }).addTo(map);

      const bounds = L.geoJSON(pointsData).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.08));

      console.log('Точек:', pointsData.features.length,
                  '| Линий:', allLines.length,
                  '| ТП с линиями:', numsWithLines.size);
    }).catch(err => {
      console.error(err);
      alert('Ошибка загрузки данных');
    });

    map.on('click', () => {
      clearActive();
      hidePanel();
    });
  </script>
</body>
</html>
