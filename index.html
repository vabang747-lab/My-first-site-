<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта ВЛ-0,4 кВ и ТП</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; }

    /* Карточка popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .leaflet-popup-content {
      margin: 14px 16px;
      min-width: 220px;
      max-width: 320px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .card-meta {
      font-size: 13px;
      color: #444;
      line-height: 1.45;
    }
    .card-meta b { color: #222; }
    .card-tag {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-top: 8px;
    }
    .card-tag.line {
      background: #e3f2fd;
      color: #1565c0;
    }

    /* Подсказка сверху */
    #hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      font-size: 14px;
      color: #333;
      pointer-events: none;
      transition: opacity .3s;
    }
    #hint strong { color: #0d47a1; }

    /* Анимация линий */
    .leaflet-interactive.line-animated {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 1.1s ease-out forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div id="hint">Нажмите на <strong>точку ТП</strong>, чтобы показать связанные линии</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ========== Карта ==========
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    }).setView([44.18, 66.70], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ========== Состояние ==========
    let pointsLayer = null;
    let allLines = [];          // все линии (скрыты)
    let activePointId = null;   // id активной точки
    let activeLineLayers = [];  // текущие видимые линии

    // ========== Утилиты ==========
    function getProp(props, ...keys) {
      for (const k of keys) {
        if (props[k] != null && props[k] !== '') return props[k];
      }
      return '';
    }

    // Извлекаем ключи для сопоставления (номера + нормализованное имя)
    function extractKeys(text) {
      if (!text) return new Set();
      const keys = new Set();
      const t = String(text).replace(/\u00a0/g, ' ').trim();

      // Полное имя
      keys.add(t.toLowerCase());

      // Все номера вида №123 или просто 123 после ключевых слов
      const nums = t.match(/(?:№\s*)?(\d{2,4})/g) || [];
      nums.forEach(n => {
        const clean = n.replace(/[^\d]/g, '');
        if (clean) {
          keys.add(clean);
          keys.add('№' + clean);
          keys.add('№ ' + clean);
        }
      });

      // Куски вида "КТПН-10/0,4 кВ №783"
      const m = t.match(/(КТП[А-Яа-я()]*|ТП)[^№]*№?\s*(\d+)/i);
      if (m) {
        keys.add((m[1] + ' №' + m[2]).toLowerCase());
        keys.add(('№' + m[2]).toLowerCase());
      }

      return keys;
    }

    // Проверяем, относится ли линия к точке
    function lineBelongsToPoint(lineProps, pointProps) {
      const pointName = getProp(pointProps, 'Name', 'name');
      const pointKeys = extractKeys(pointName);

      const lineName = getProp(lineProps, 'Name', 'name');
      const lineDesc = getProp(lineProps, 'Description', 'description');
      const lineText = (lineName + ' ' + lineDesc).toLowerCase().replace(/\u00a0/g, ' ');

      // Ищем совпадение по ключам точки в тексте линии
      for (const k of pointKeys) {
        if (k.length < 2) continue;
        // Для коротких номеров требуем контекст "№" или "от"
        if (/^\d{2,4}$/.test(k)) {
          if (lineText.includes('№' + k) || lineText.includes('№ ' + k) ||
              lineText.includes('от ' + k) || lineText.includes('кв №' + k) ||
              lineText.includes('кв ' + k)) {
            return true;
          }
        } else if (lineText.includes(k)) {
          return true;
        }
      }
      return false;
    }

    // Красивая карточка для точки
    function pointPopup(props) {
      const name = getProp(props, 'Name', 'name') || 'ТП';
      const power = getProp(props, 'Ном.мощность, кВА') || '';
      const year = getProp(props, 'Год ввода') || '';
      const feeder = getProp(props, 'Запитано от фидера') || '';
      const balance = getProp(props, 'На балансе') || '';
      const inv = getProp(props, 'Зав/Инв №') || '';
      const desc = getProp(props, 'описание', 'Description', 'description') || '';

      let html = `<div class="card-title">${name}</div><div class="card-meta">`;
      if (power) html += `<div><b>Мощность:</b> ${power}</div>`;
      if (year) html += `<div><b>Год ввода:</b> ${year}</div>`;
      if (feeder) html += `<div><b>Фидер:</b> ${feeder}</div>`;
      if (balance) html += `<div><b>На балансе:</b> ${balance}</div>`;
      if (inv) html += `<div><b>Инв. №:</b> ${inv}</div>`;
      if (desc && !desc.includes('<img') && desc.length < 200) {
        html += `<div style="margin-top:6px">${desc.replace(/\n/g, '<br>')}</div>`;
      }
      html += `</div><div class="card-tag">Трансформаторный пункт</div>`;
      return html;
    }

    // Карточка для линии
    function linePopup(props) {
      const name = getProp(props, 'Name', 'name') || 'Линия';
      let desc = getProp(props, 'Description', 'description') || '';
      // Убираем ссылки на google maps из описания для краткости
      desc = desc.replace(/https?:\/\/[^\s<]+/g, '').replace(/<br\s*\/?>/gi, '<br>').trim();

      let html = `<div class="card-title">${name}</div><div class="card-meta">`;
      if (desc) html += `<div>${desc}</div>`;
      html += `</div><div class="card-tag line">ВЛ-0,4 кВ</div>`;
      return html;
    }

    // Скрыть все активные линии
    function clearActiveLines() {
      activeLineLayers.forEach(l => map.removeLayer(l));
      activeLineLayers = [];
      activePointId = null;
    }

    // Показать линии, связанные с точкой
    function showLinesForPoint(pointFeature, pointLayer) {
      const pointId = pointFeature.properties._id || pointFeature.id;
      const pointProps = pointFeature.properties;

      // Если кликнули ту же точку — скрываем
      if (activePointId === pointId) {
        clearActiveLines();
        map.closePopup();
        document.getElementById('hint').style.opacity = '1';
        return;
      }

      clearActiveLines();
      activePointId = pointId;

      const related = allLines.filter(lf => lineBelongsToPoint(lf.properties, pointProps));

      if (related.length === 0) {
        pointLayer.bindPopup(pointPopup(pointProps) +
          '<div style="margin-top:8px;color:#c62828;font-size:13px">Связанных линий не найдено</div>'
        ).openPopup();
        return;
      }

      related.forEach((lf, idx) => {
        const layer = L.geoJSON(lf, {
          style: {
            color: '#0F9D58',
            weight: 4,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
          },
          onEachFeature: (f, l) => {
            l.bindPopup(linePopup(f.properties));
            // Анимация "рисования"
            setTimeout(() => {
              const path = l.getElement?.() || (l._path);
              if (path) {
                path.classList.add('line-animated');
              }
            }, 30 + idx * 80);
          }
        }).addTo(map);

        activeLineLayers.push(layer);
      });

      // Подгоняем вид под точку + линии
      const group = L.featureGroup([pointLayer, ...activeLineLayers]);
      map.fitBounds(group.getBounds().pad(0.25), { maxZoom: 16, animate: true });

      pointLayer.bindPopup(
        pointPopup(pointProps) +
        `<div style="margin-top:8px;font-size:13px;color:#2e7d32">Показано линий: <b>${related.length}</b></div>`
      ).openPopup();

      document.getElementById('hint').style.opacity = '0.4';
    }

    // ========== Загрузка данных ==========
    Promise.all([
      fetch('data/points.geojson').then(r => r.json()),
      fetch('data/lines.geojson').then(r => r.json())
    ]).then(([pointsData, linesData]) => {

      // Сохраняем линии (пока не добавляем на карту)
      allLines = linesData.features.map((f, i) => {
        f.properties._id = 'line-' + i;
        return f;
      });

      // Точки
      pointsData.features.forEach((f, i) => {
        f.properties._id = 'point-' + i;
      });

      pointsLayer = L.geoJSON(pointsData, {
        pointToLayer: (feature, latlng) => {
          return L.circleMarker(latlng, {
            radius: 7,
            fillColor: '#01579B',
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });
        },
        onEachFeature: (feature, layer) => {
          layer.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            showLinesForPoint(feature, layer);
          });

          // Hover-эффект
          layer.on('mouseover', () => {
            layer.setStyle({ radius: 10, fillColor: '#0288D1' });
          });
          layer.on('mouseout', () => {
            layer.setStyle({ radius: 7, fillColor: '#01579B' });
          });
        }
      }).addTo(map);

      // Общий вид
      if (pointsLayer.getLayers().length) {
        map.fitBounds(pointsLayer.getBounds().pad(0.1));
      }

      console.log('Точек:', pointsData.features.length, '| Линий:', allLines.length);
    }).catch(err => {
      console.error(err);
      alert('Ошибка загрузки данных. Убедитесь, что файлы data/points.geojson и data/lines.geojson на месте.');
    });

    // Клик по пустой карте — скрыть линии
    map.on('click', () => {
      clearActiveLines();
      document.getElementById('hint').style.opacity = '1';
    });
  </script>
</body>
</html>
