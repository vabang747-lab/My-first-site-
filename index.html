<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта энергосетей</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    
    /* Стили для всплывающих окон (Popup) */
    .popup-content {
      max-width: 300px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
    }
    .popup-content h3 {
      margin-bottom: 8px;
      font-size: 15px;
      color: #01579b;
      border-bottom: 2px solid #01579b;
      padding-bottom: 4px;
    }
    .popup-content img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 6px 0;
      display: block;
    }
    .popup-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .popup-info-table td {
      padding: 3px 0;
      vertical-align: top;
    }
    .popup-info-table td.label {
      font-weight: bold;
      color: #555;
      padding-right: 6px;
      white-space: nowrap;
    }
    .popup-content a {
      color: #0288d1;
      text-decoration: none;
      word-break: break-all;
    }
    .popup-content a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Инициализация карты (центрируем в районе Шиели)
    const map = L.map('map').setView([44.18, 66.73], 12);

    // 2. Подключение тайлов (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 3. Функция формирования контента для Popup
    function createPopupContent(properties) {
      let html = `<div class="popup-content">`;
      
      if (properties.name) {
        html += `<h3>${properties.name}</h3>`;
      }

      // Вывод табличных специфичных полей, если они заполнены
      let details = '';
      if (properties['Ном.мощность, кВА']) details += `<tr><td class="label">Мощность:</td><td>${properties['Ном.мощность, кВА']}</td></tr>`;
      if (properties['Запитано от фидера']) details += `<tr><td class="label">Фидер:</td><td>${properties['Запитано от фидера']}</td></tr>`;
      if (properties['Год ввода']) details += `<tr><td class="label">Год ввода:</td><td>${properties['Год ввода']}</td></tr>`;
      if (properties['На балансе']) details += `<tr><td class="label">На балансе:</td><td>${properties['На балансе']}</td></tr>`;
      if (properties['Зав/Инв №']) details += `<tr><td class="label">Инв. №:</td><td>${properties['Зав/Инв №']}</td></tr>`;

      if (details !== '') {
        html += `<table class="popup-info-table">${details}</table><hr style="margin:8px 0; border:none; border-top:1px solid #ccc;">`;
      }

      // Вывод основного описания (parsing HTML/text из description)
      if (properties.description) {
        let desc = typeof properties.description === 'object' ? properties.description.value : properties.description;
        // Превращаем ссылки в кликабельные, если это plain text
        desc = desc.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
          // проверяем, не находится ли ссылка уже внутри src= или href=
          return `<a href="${url}" target="_blank" rel="noopener">Ссылка</a>`;
        });
        html += `<div>${desc}</div>`;
      }

      // Дополнительные медиа-ссылки (картинки), если есть
      if (properties.gx_media_links) {
        const links = properties.gx_media_links.split(' ');
        links.forEach(url => {
          if (url.trim() && !html.includes(url.trim())) {
            html += `<img src="${url.trim()}" alt="Медиа объект">`;
          }
        });
      }

      html += `</div>`;
      return html;
    }

    // 4. Загрузка GeoJSON с GitHub / локального файла
    // Замени url на прямую ссылку сырого файла (raw.githubusercontent.com)
    const geojsonUrl = 'data.geojson'; 

    fetch(geojsonUrl)
      .then(response => response.json())
      .then(data => {
        const geoJsonLayer = L.geoJSON(data, {
          
          // Стилизация линий и полигонов на основе свойств из GeoJSON
          style: function(feature) {
            const props = feature.properties || {};
            return {
              color: props.stroke || '#0288d1',
              weight: props['stroke-width'] ? parseFloat(props['stroke-width']) : 3,
              opacity: props['stroke-opacity'] !== undefined ? parseFloat(props['stroke-opacity']) : 1,
              fillColor: props.fill || '#0288d1',
              fillOpacity: props['fill-opacity'] !== undefined ? parseFloat(props['fill-opacity']) : 0.4
            };
          },

          // Отображение точечных объектов (Point) кастомными маркерами
          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: '#01579b',
              color: '#ffffff',
              weight: 1.5,
              opacity: 1,
              fillOpacity: 0.9
            });
          },

          // Привязка всплывающих окон
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              layer.bindPopup(createPopupContent(feature.properties));
            }
          }
        }).addTo(map);

        // Автоматическое подгоны масштаба карты под все объекты
        map.fitBounds(geoJsonLayer.getBounds());
      })
      .catch(err => console.error('Ошибка загрузки GeoJSON:', err));
  </script>
</body>
</html>
