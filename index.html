<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПТО Инжиниринг — Геоинформационная система энергоузла</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #2563eb;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--primary-dark);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 i {
            color: #60a5fa;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .header-stats span strong {
            color: #fff;
        }

        /* Main Workspace Layout */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 53px);
        }

        /* Left Control Panel / Table View */
        .sidebar {
            width: 48%;
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        /* Toolbar / Filters */
        .toolbar {
            padding: 12px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-excel {
            background-color: #107c41;
            color: white;
        }
        .btn-excel:hover { background-color: #0b592e; }

        .btn-print {
            background-color: #475569;
            color: white;
        }
        .btn-print:hover { background-color: #334155; }

        /* Table Area */
        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            padding: 10px 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover {
            background-color: #f1f5f9;
            cursor: pointer;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-tp { background: #dbeafe; color: #1e40af; }
        .badge-line { background: #fef3c7; color: #92400e; }
        .badge-sub { background: #dcfce7; color: #166534; }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Printable area override */
        @media print {
            header, .map-container, .toolbar { display: none !important; }
            .sidebar { width: 100% !important; border: none; }
            body { overflow: visible !important; }
            .table-container { overflow: visible !important; }
            th, td { font-size: 10pt; padding: 6px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><i class="fa-solid fa-bolt"></i> ГИС ПТО — Энергоузел Шиелийского РЭС</h1>
        <div class="header-stats">
            <span>Всего объектов: <strong id="total-count">0</strong></span>
            <span>Загружено из: <strong>map.geojson</strong></span>
        </div>
    </header>

    <!-- Content Area -->
    <div class="main-container">
        
        <!-- Sidebar: Filter & Data Table -->
        <div class="sidebar">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Поиск по названию, фидеру, оборудованию..." onkeyup="filterTable()">
                </div>
                <button class="btn btn-excel" onclick="exportToCSV()">
                    <i class="fa-solid fa-file-excel"></i> Скачать CSV/Excel
                </button>
                <button class="btn btn-print" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Печать
                </button>
            </div>

            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Код</th>
                            <th>Наименование / Диспетчерское</th>
                            <th>Категория</th>
                            <th>Фидер / Источник</th>
                            <th>Мощность / Оборудование</th>
                            <th>Ввод в экспл.</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Side: GIS Map -->
        <div class="map-container">
            <div id="map"></div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Инициализация карты
        const map = L.map('map').setView([44.15, 66.75], 11); // Координаты района Шиели

        // Подложка OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap | АО КРЭК ПТО'
        }).addTo(map);

        let geojsonLayer;
        let allFeatures = [];

        // Автоматическая загрузка вашей базы данных map.geojson
        fetch('map.geojson')
            .then(response => {
                if (!response.ok) throw new Error("Не удалось загрузить map.geojson");
                return response.json();
            })
            .then(data => {
                allFeatures = data.features || [];
                document.getElementById('total-count').innerText = allFeatures.length;

                // Отображение на карте
                geojsonLayer = L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            color: feature.properties._object_category === 'overhead_line_10kv' ? '#d97706' : '#2563eb',
                            weight: 3,
                            opacity: 0.8
                        };
                    },
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#dc2626",
                            color: "#fff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties || {};
                        const name = props._source_name || props.name || "Объект без имени";
                        const category = props._object_category || "Не указана";
                        
                        let popupContent = `<strong>${name}</strong><br>`;
                        popupContent += `<small>Категория: ${category}</small><br>`;
                        if(props.description) popupContent += `<hr style="margin:4px 0">${props.description}`;
                        
                        layer.bindPopup(popupContent);
                    }
                }).addTo(map);

                // Подогнать масштаб под все объекты
                if (geojsonLayer.getBounds().isValid()) {
                    map.fitBounds(geojsonLayer.getBounds());
                }

                // Заполнение таблицы
                renderTable(allFeatures);
            })
            .catch(err => {
                console.error(err);
                alert("Ошибка при загрузке map.geojson. Убедитесь, что файл лежит в корне репозитория!");
            });

        // Функция рендеринга таблицы
        function renderTable(features) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            features.forEach((feat, index) => {
                const p = feat.properties || {};
                const id = p._feature_id || `F${index+1}`;
                const name = p._source_name || p.name || '—';
                const cat = p._object_category || 'other';
                
                // Извлечение фидера и оборудования из описания/свойств
                const feeder = p.feeder || p.supplied_by || '—';
                const power = p.power || p.transformer || '—';
                const year = p.commissioning_date || '—';

                let badgeClass = 'badge-tp';
                if (cat.includes('line')) badgeClass = 'badge-line';
                if (cat.includes('substation') || cat.includes('transformer')) badgeClass = 'badge-sub';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${id}</strong></td>
                    <td>${name}</td>
                    <td><span class="badge ${badgeClass}">${cat}</span></td>
                    <td>${feeder}</td>
                    <td>${power}</td>
                    <td>${year}</td>
                `;

                // При клике на строку — фокус на объекте карты
                tr.onclick = () => {
                    if (geojsonLayer) {
                        geojsonLayer.eachLayer(layer => {
                            if (layer.feature === feat) {
                                map.fitBounds(layer.getBounds ? layer.getBounds() : L.latLngBounds([layer.getLatLng()]), {maxZoom: 15});
                                layer.openPopup();
                            }
                        });
                    }
                };

                tbody.appendChild(tr);
            });
        }

        // Фильтрация таблицы
        function filterTable() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFeatures.filter(f => {
                const p = f.properties || {};
                const str = `${p._feature_id} ${p._source_name} ${p.name} ${p._object_category} ${p.description}`.toLowerCase();
                return str.includes(val);
            });
            renderTable(filtered);
        }

        // Экспорт таблицы в CSV (Excel)
        function exportToCSV() {
            let csv = '\uFEFF'; // UTF-8 BOM для корректного отображения кириллицы в Excel
            csv += 'Код;Наименование;Категория;Фидер/Источник;Описание\n';

            allFeatures.forEach((f, i) => {
                const p = f.properties || {};
                const id = p._feature_id || `F${i+1}`;
                const name = (p._source_name || p.name || '').replace(/;/g, ' ');
                const cat = (p._object_category || '').replace(/;/g, ' ');
                const feeder = (p.supplied_by || '').replace(/;/g, ' ');
                const desc = (p.description || '').replace(/(\r\n|\n|\r|;)/gm, " ");

                csv += `"${id}";"${name}";"${cat}";"${feeder}";"${desc}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `Ведомость_Оборудования_ПТО_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
